[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-fusion"
version = "0.1.0"
description = "Research code for image-only brain-tumor classification and Grad-CAM visualization."
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.57.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "Pillow==11.3.0",
  "scikit-learn==1.7.2",
  "matplotlib==3.10.7",
  "seaborn==0.13.2",
  "opencv-python==4.12.0.88",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
ui = ["streamlit==1.50.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
